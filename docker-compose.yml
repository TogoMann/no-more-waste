services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nmw-backend
    environment:
      JWT_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@nomorewaste.org
      ADMIN_PASSWORD: admin123
      SEED_DEMO: "true"
      PUBLIC_URL: http://localhost:8081
      DUES_AMOUNT_CENTS: "2000"
      STRIPE_PUBLIC_KEY: pk_test_51TqxnxGrveXpz3HG2iv6PY8WAEWhcp6BA08aIcHehvHiogddG7NYc4pNJ7IznC7tLrXP3sDM4CLCdaGX0kBLIHzX00PVZgCvnx
      STRIPE_WEBHOOK_SECRET: whsec_cc886fdcf142a29a27013feedba062b6145ef3422b27899cb4fabdadc70f22c9
    volumes:
      - backend-data:/app/data
    ports:
