services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nmw-backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nomorewaste.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO: ${SEED_DEMO:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9080}
      DUES_AMOUNT_CENTS: ${DUES_AMOUNT_CENTS:-2000}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "${API_PORT:-9081}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ${FRONTEND_DOCKERFILE:-frontend/Dockerfile}
    container_name: nmw-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-9080}:80"
    restart: unless-stopped

volumes:
  backend-data:
